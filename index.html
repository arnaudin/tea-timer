<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steep</title>
<meta name="description" content="A quiet tea and coffee timer that flashes when the brew is ready.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@200;300&family=Karla:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{
  --ground:#e7eae2;
  --ground-2:#dde2d6;
  --ink:#1f2b25;
  --ink-2:#5f6d64;
  --line:#c3cbbb;
  --leaf:#6d8260;
  --amber:#b98a46;
  --amber-deep:#8c6226;
  --flash-a:#b98a46;
  --flash-b:#e7eae2;
  --flash-ink:#1f2b25;
  --steep:0;
  --bg:color-mix(in oklab, var(--ground), var(--amber) calc(var(--steep) * 24%));
  --mono:"Azeret Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans:Karla, "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121714;
    --ground-2:#1a201c;
    --ink:#e5e8df;
    --ink-2:#8e9a90;
    --line:#2b342e;
    --leaf:#9db18a;
    --amber:#d6a75d;
    --amber-deep:#b4843b;
    --flash-a:#d6a75d;
    --flash-b:#a3742f;
    --flash-ink:#121714;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121714;
  --ground-2:#1a201c;
  --ink:#e5e8df;
  --ink-2:#8e9a90;
  --line:#2b342e;
  --leaf:#9db18a;
  --amber:#d6a75d;
  --amber-deep:#b4843b;
  --flash-a:#d6a75d;
  --flash-b:#a3742f;
  --flash-ink:#121714;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.4;
  overflow:hidden;
  transition:background 1.2s linear;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--leaf);outline-offset:3px;border-radius:999px}

/* ---------- top progress hairline (corner mode) ---------- */
.hairline{
  position:fixed;left:0;top:0;height:3px;width:100%;
  background:var(--line);opacity:0;transition:opacity .3s;z-index:5;
  pointer-events:none;
}
.hairline i{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--leaf),var(--amber));
  transition:width .25s linear;
}

/* ---------- frame ---------- */
.app{
  height:100%;
  max-width:720px;
  margin:0 auto;
  padding-block:clamp(10px,3vmin,28px);
  padding-inline:16px;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto;
  gap:clamp(6px,2.2vmin,20px);
}
.top{
  grid-row:1;
  display:flex;align-items:center;justify-content:space-between;
  color:var(--ink-2);
}
.brand{
  font-family:var(--mono);font-weight:300;letter-spacing:.22em;text-transform:uppercase;
  font-size:.72rem;
}
.icon{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;color:var(--ink-2);
  transition:background .2s,color .2s;
}
.icon:hover{background:var(--ground-2)}
.icon[aria-pressed="true"]{color:var(--ink)}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon .off{display:none}
.icon[aria-pressed="false"] .off{display:block}

/* ---------- vessel: ring + clock ---------- */
.vessel{
  grid-row:2;
  position:relative;
  display:grid;place-items:center;
  min-height:0;
  container-type:size;
}
.vessel::before{
  content:"";position:absolute;inset:0;margin:auto;
  width:min(100cqw,100cqh);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle, color-mix(in oklab,var(--amber),transparent 78%) 0%, transparent 62%);
  opacity:0;transition:opacity 1.5s;
  transform:scale(.9);
}
.app.running .vessel::before{
  opacity:1;
  animation:breathe 8s ease-in-out infinite;
}
@keyframes breathe{
  0%{transform:scale(.88)}
  45%{transform:scale(1.06)}
  100%{transform:scale(.88)}
}
.ring{
  position:absolute;inset:0;margin:auto;
  width:min(100cqw,100cqh);height:auto;
  aspect-ratio:1;
  display:block;
  overflow:visible;
}
.ring .track{fill:none;stroke:var(--line);stroke-width:1.5}
.ring .fill{
  fill:none;stroke:url(#steepGrad);stroke-width:3.5;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:50% 50%;
  stroke-dasharray:1;stroke-dashoffset:1;
  transition:stroke-dashoffset .3s linear;
}
.clock{
  position:absolute;inset:0;
  display:grid;place-content:center;justify-items:center;
  gap:.35em;
  text-align:center;
}
.time{
  font-family:var(--mono);font-weight:200;
  font-size:clamp(2.6rem,15vmin,7rem);
  line-height:1;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  transition:color .4s;
}
.app.paused .time{color:var(--ink-2)}
.label{
  font-size:clamp(.8rem,2.2vmin,1rem);
  color:var(--ink-2);
  letter-spacing:.04em;
}

/* ---------- tray: presets while idle, prompts while brewing ---------- */
.tray{
  grid-row:4;
  display:grid;
  align-items:center;
  width:100%;
}
.tray > *{grid-area:1/1}
.presets{transition:opacity .6s ease,visibility .6s}
.app.brewing .presets{opacity:0;visibility:hidden}
.app:not(.brewing) .prompt{opacity:0;visibility:hidden}

.prompt{
  margin:0 auto;
  text-align:center;
  font-style:italic;
  color:var(--ink-2);
  font-size:clamp(.85rem,2.4vmin,1.05rem);
  min-height:1.4em;
  max-width:36ch;
  text-wrap:balance;
  transition:opacity .9s ease,visibility .9s;
}
.prompt.fade{opacity:0}

/* ---------- controls ---------- */
.controls{
  grid-row:3;
  display:flex;justify-content:center;align-items:center;gap:12px;
}
.primary{
  min-width:9.5em;
  padding:.7em 1.6em;
  border-radius:999px;
  background:var(--ink);color:var(--ground);
  font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;
  transition:transform .15s,opacity .2s;
}
.primary:hover{transform:translateY(-1px)}
.primary:active{transform:translateY(0)}
.ghost{
  padding:.7em 1.1em;border-radius:999px;
  color:var(--ink-2);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;
  transition:color .2s,background .2s;
}
.ghost:hover{color:var(--ink);background:var(--ground-2)}
.ghost:disabled{opacity:.35;cursor:default;background:none;color:var(--ink-2)}

/* ---------- presets ---------- */
.presets{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:6px 18px;
}
.group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.eyebrow{
  font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);
  margin-right:2px;
}
.pill{
  display:inline-flex;align-items:baseline;gap:.45em;
  padding:.42em .85em;border-radius:999px;
  border:1px solid var(--line);
  color:var(--ink);
  font-size:.8rem;
  transition:background .2s,border-color .2s,color .2s;
  white-space:nowrap;
}
.pill .d{font-family:var(--mono);font-size:.7rem;color:var(--ink-2);font-weight:300}
.pill .short{display:none}
.pill:hover{border-color:var(--ink-2)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.pill[aria-pressed="true"] .d{color:color-mix(in oklab,var(--ground),transparent 30%)}
.custom-fields{
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--mono);font-size:.8rem;color:var(--ink-2);
}
.custom-fields[hidden]{display:none}
.custom-fields input{
  width:3.2em;padding:.35em .3em;
  font:inherit;color:var(--ink);text-align:center;
  background:var(--ground-2);border:1px solid var(--line);border-radius:8px;
  -moz-appearance:textfield;
}
.custom-fields input::-webkit-inner-spin-button,.custom-fields input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.custom-fields input:focus-visible{border-radius:8px;outline-offset:1px}

/* ---------- done overlay ---------- */
.done{
  position:fixed;inset:0;z-index:10;
  display:grid;place-items:center;text-align:center;
  background:var(--flash-a);color:var(--flash-ink);
  cursor:pointer;
  animation:flash 1.1s ease-in-out infinite;
}
.done[hidden]{display:none}
.done-title{
  font-family:var(--mono);font-weight:200;
  font-size:clamp(2.6rem,18vmin,8rem);line-height:1;letter-spacing:-.02em;
}
.done-sub{margin-top:.6em;font-size:clamp(.8rem,2.4vmin,1rem);letter-spacing:.06em;opacity:.8}
@keyframes flash{
  0%,100%{background:var(--flash-a)}
  50%{background:var(--flash-b)}
}

/* ---------- compact / corner mode ---------- */
@media (max-width:480px),(max-height:400px){
  .app{gap:clamp(4px,1.6vmin,12px)}
  .pill .full{display:none}
  .pill .short{display:inline}
  .pill .d{display:none}
  .pill{padding:.35em .7em;font-size:.74rem}
  .eyebrow{display:none}
  .presets{gap:5px}
}
/* short windows: give the countdown the tray's space while brewing */
@media (max-height:400px){
  .app.brewing .tray{display:none}
}
@media (max-height:300px){
  .hairline{opacity:1}
  .ring{display:none}
  .vessel::before{display:none}
  .clock{position:static}
  .time{font-size:min(30vmin,24vw)}
  .brand{display:none}
  .top{position:absolute;right:10px;top:8px}
  .presets{
    flex-wrap:nowrap;justify-content:flex-start;
    overflow-x:auto;scrollbar-width:none;
    margin-inline:-16px;padding-inline:16px;
    mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);
  }
  .presets::-webkit-scrollbar{display:none}
  .group{flex-wrap:nowrap}
  .primary{min-width:0;padding:.55em 1.2em}
  .ghost{padding:.55em .9em}
}

@media (prefers-reduced-motion: reduce){
  .app.running .vessel::before{animation:none;transform:scale(1)}
  .done{animation:none;background:var(--amber)}
  .primary:hover{transform:none}
}
</style>
</head>
<body>

<div class="hairline" aria-hidden="true"><i id="hairfill"></i></div>

<main class="app" id="app">
  <header class="top">
    <span class="brand">Steep</span>
    <button class="icon" id="chime" aria-pressed="true" title="Chime when ready" aria-label="Chime when ready">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/>
        <path d="M10 20a2 2 0 0 0 4 0"/>
        <path class="off" d="M4 4l16 16"/>
      </svg>
    </button>
  </header>

  <section class="vessel" aria-label="Countdown">
    <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="steepGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--leaf)"/>
          <stop offset="1" stop-color="var(--amber)"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="100" cy="100" r="92"/>
      <circle class="fill" id="ringfill" cx="100" cy="100" r="92" pathLength="1"/>
    </svg>
    <div class="clock">
      <div class="time" id="time" role="timer" aria-live="off">4:00</div>
      <div class="label" id="label">Black tea</div>
    </div>
  </section>

  <div class="controls">
    <button class="ghost" id="reset" disabled>Reset</button>
    <button class="primary" id="start">Begin</button>
  </div>

  <div class="tray">
    <p class="prompt" id="prompt" aria-live="polite">Choose a brew, then begin.</p>
    <nav class="presets" id="presets" aria-label="Brew presets">
    <div class="group" id="group-tea"><span class="eyebrow">Tea</span></div>
    <div class="group" id="group-coffee"><span class="eyebrow">Coffee</span></div>
    <div class="group">
      <button class="pill" id="custom-pill" data-id="custom" aria-pressed="false">
        <span class="n"><span class="full">Custom</span><span class="short">Custom</span></span>
      </button>
      <span class="custom-fields" id="custom-fields" hidden>
        <input type="number" id="custom-min" min="0" max="99" inputmode="numeric" aria-label="Minutes" value="3">
        <span>:</span>
        <input type="number" id="custom-sec" min="0" max="59" inputmode="numeric" aria-label="Seconds" value="00">
      </span>
    </div>
    </nav>
  </div>
</main>

<div class="done" id="done" hidden role="alert">
  <div>
    <div class="done-title">Ready</div>
    <div class="done-sub" id="done-sub">Take the first sip slowly.</div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // Standard steep and brew times. Adjust to taste.
  const PRESETS = [
    {id:'green',   name:'Green tea',    short:'Green',  sec:120, kind:'tea'},
    {id:'white',   name:'White tea',    short:'White',  sec:180, kind:'tea'},
    {id:'oolong',  name:'Oolong',       short:'Oolong', sec:180, kind:'tea'},
    {id:'black',   name:'Black tea',    short:'Black',  sec:240, kind:'tea'},
    {id:'herbal',  name:'Herbal',       short:'Herbal', sec:300, kind:'tea'},
    {id:'aeropress',name:'Aeropress',   short:'Aero',   sec:90,  kind:'coffee'},
    {id:'pourover',name:'Pour-over',    short:'Pour',   sec:180, kind:'coffee'},
    {id:'french',  name:'French press', short:'Press',  sec:240, kind:'coffee'},
  ];

  const PROMPTS = [
    'Let your shoulders drop away from your ears.',
    'Breathe in for four. Out for six.',
    'Notice the weight of your feet on the floor.',
    'Watch the color deepen. There is nothing to do yet.',
    'Unclench your jaw. Soften your gaze.',
    'Listen for the quietest sound in the room.',
    'One thing at a time. Right now, it is this.',
    'Feel the warmth of the cup before you lift it.',
  ];

  const STORE = 'steep.v1';
  const $ = id => document.getElementById(id);
  const app = $('app'), timeEl = $('time'), labelEl = $('label'), promptEl = $('prompt');
  const startBtn = $('start'), resetBtn = $('reset'), chimeBtn = $('chime');
  const ringFill = $('ringfill'), hairFill = $('hairfill');
  const doneEl = $('done'), doneSub = $('done-sub');
  const customPill = $('custom-pill'), customFields = $('custom-fields');
  const customMin = $('custom-min'), customSec = $('custom-sec');

  // ---------- state ----------
  let state = {
    presetId:'black',
    customSec:180,
    chime:true,
    status:'idle',      // idle | running | paused | done
    endAt:0,            // ms epoch, while running
    remainingMs:0,      // while paused
  };

  function load(){
    try{
      const raw = localStorage.getItem(STORE);
      if(raw){ Object.assign(state, JSON.parse(raw)); }
    }catch(e){}
    if(!PRESETS.some(p=>p.id===state.presetId) && state.presetId!=='custom') state.presetId='black';
    state.customSec = clamp(+state.customSec||180, 5, 99*60+59);
  }
  function save(){
    try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
  }
  function clamp(n,a,b){ return Math.min(b, Math.max(a,n)); }

  function current(){
    if(state.presetId==='custom') return {id:'custom', name:'Custom', short:'Custom', sec:state.customSec};
    return PRESETS.find(p=>p.id===state.presetId);
  }
  function fmt(sec){
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec/60), s = sec%60;
    return m + ':' + String(s).padStart(2,'0');
  }

  // ---------- presets UI ----------
  function buildPresets(){
    for(const p of PRESETS){
      const b = document.createElement('button');
      b.className='pill'; b.dataset.id=p.id; b.setAttribute('aria-pressed','false');
      b.innerHTML = '<span class="n"><span class="full">'+p.name+'</span><span class="short">'+p.short+'</span></span><span class="d">'+fmt(p.sec)+'</span>';
      b.addEventListener('click', ()=>selectPreset(p.id));
      $(p.kind==='tea'?'group-tea':'group-coffee').appendChild(b);
    }
    customPill.addEventListener('click', ()=>selectPreset('custom'));
    const onCustom = ()=>{
      const m = clamp(parseInt(customMin.value,10)||0, 0, 99);
      const s = clamp(parseInt(customSec.value,10)||0, 0, 59);
      state.customSec = Math.max(5, m*60+s);
      if(state.status==='idle') render();
      save();
    };
    customMin.addEventListener('input', onCustom);
    customSec.addEventListener('input', onCustom);
    customSec.addEventListener('blur', ()=>{ customSec.value = String(clamp(parseInt(customSec.value,10)||0,0,59)).padStart(2,'0'); });
  }
  function selectPreset(id){
    if(state.status==='running' || state.status==='paused'){
      // switching mid-brew resets to the new brew
      stopTick();
    }
    state.presetId = id;
    state.status='idle'; state.endAt=0; state.remainingMs=0;
    save(); render(); setPrompt('Choose a brew, then begin.', true);
  }
  function renderPresets(){
    document.querySelectorAll('.pill').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.id===state.presetId)));
    customFields.hidden = state.presetId!=='custom';
    customMin.value = Math.floor(state.customSec/60);
    customSec.value = String(state.customSec%60).padStart(2,'0');
  }

  // ---------- timer ----------
  let tickId = 0;
  function begin(){
    unlockAudio();
    const dur = current().sec*1000;
    state.status='running';
    state.endAt = Date.now() + (state.remainingMs>0 ? state.remainingMs : dur);
    state.remainingMs=0;
    save(); startTick(); render(); startPrompts();
  }
  function pause(){
    state.remainingMs = Math.max(0, state.endAt - Date.now());
    state.status='paused'; state.endAt=0;
    stopTick(); stopPrompts(); save(); render();
    setPrompt('Paused. Take your time.', true);
  }
  function reset(){
    stopTick(); stopPrompts();
    state.status='idle'; state.endAt=0; state.remainingMs=0;
    save(); render();
    setPrompt('Choose a brew, then begin.', true);
  }
  function finish(){
    stopTick(); stopPrompts();
    state.status='done'; state.endAt=0; state.remainingMs=0;
    save(); render();
    if(state.chime) playChime();
  }
  function dismiss(){
    if(state.status!=='done') return;
    reset();
  }
  function startTick(){ stopTick(); tick(); tickId = setInterval(tick, 200); }
  function stopTick(){ if(tickId){ clearInterval(tickId); tickId=0; } }
  function tick(){
    const left = state.endAt - Date.now();
    if(left<=0){ finish(); return; }
    paint(left);
  }

  // ---------- render ----------
  let lastTitle='';
  function paint(leftMs){
    const total = current().sec*1000;
    const leftSec = leftMs/1000;
    timeEl.textContent = fmt(leftSec);
    const progress = clamp(1 - leftMs/total, 0, 1);
    ringFill.style.strokeDashoffset = String(1-progress);
    hairFill.style.width = (progress*100)+'%';
    document.documentElement.style.setProperty('--steep', progress.toFixed(3));
    const t = fmt(leftSec)+' · '+current().name;
    if(t!==lastTitle){ document.title=t; lastTitle=t; }
  }
  function render(){
    const p = current();
    app.classList.toggle('running', state.status==='running');
    app.classList.toggle('paused', state.status==='paused');
    app.classList.toggle('brewing', state.status==='running' || state.status==='paused');
    labelEl.textContent = p.name;
    renderPresets();
    chimeBtn.setAttribute('aria-pressed', String(state.chime));

    if(state.status==='running'){
      startBtn.textContent='Pause'; resetBtn.disabled=false;
      paint(Math.max(0, state.endAt-Date.now()));
    }else if(state.status==='paused'){
      startBtn.textContent='Resume'; resetBtn.disabled=false;
      paint(state.remainingMs);
    }else if(state.status==='done'){
      startBtn.textContent='Begin'; resetBtn.disabled=true;
      timeEl.textContent='0:00';
      ringFill.style.strokeDashoffset='0';
      hairFill.style.width='100%';
      document.documentElement.style.setProperty('--steep','1');
      document.title='Ready · '+p.name; lastTitle=document.title;
    }else{
      startBtn.textContent='Begin'; resetBtn.disabled=true;
      timeEl.textContent=fmt(p.sec);
      ringFill.style.strokeDashoffset='1';
      hairFill.style.width='0%';
      document.documentElement.style.setProperty('--steep','0');
      document.title='Steep'; lastTitle='Steep';
    }
    doneSub.textContent = p.name+' is ready. Take the first sip slowly.';
    doneEl.hidden = state.status!=='done';
  }

  // ---------- grounding prompts ----------
  let promptId=0, promptIdx=-1;
  function setPrompt(text, immediate){
    if(immediate){ promptEl.classList.remove('fade'); promptEl.textContent=text; return; }
    promptEl.classList.add('fade');
    setTimeout(()=>{ promptEl.textContent=text; promptEl.classList.remove('fade'); }, 900);
  }
  function nextPrompt(first){
    promptIdx = (promptIdx+1) % PROMPTS.length;
    setPrompt(PROMPTS[promptIdx], !!first);
  }
  function startPrompts(){
    stopPrompts();
    promptIdx = Math.floor(Math.random()*PROMPTS.length)-1;
    nextPrompt(true);
    promptId = setInterval(()=>nextPrompt(false), 16000);
  }
  function stopPrompts(){ if(promptId){ clearInterval(promptId); promptId=0; } }

  // ---------- chime (synthesized bowl, no assets) ----------
  let audio=null;
  function unlockAudio(){
    try{
      if(!audio) audio = new (window.AudioContext||window.webkitAudioContext)();
      if(audio.state==='suspended') audio.resume();
    }catch(e){}
  }
  function strike(t, vol){
    const partials=[[1,1],[2.01,.45],[2.94,.22],[4.16,.12]];
    const base=528;
    for(const [ratio,g] of partials){
      const o=audio.createOscillator(), a=audio.createGain();
      o.type='sine'; o.frequency.value=base*ratio;
      a.gain.setValueAtTime(0.0001,t);
      a.gain.exponentialRampToValueAtTime(vol*g*0.35, t+0.015);
      a.gain.exponentialRampToValueAtTime(0.0001, t+3.2/ratio);
      o.connect(a).connect(audio.destination);
      o.start(t); o.stop(t+3.4);
    }
  }
  function playChime(){
    try{
      unlockAudio();
      const t=audio.currentTime+0.05;
      strike(t,1); strike(t+1.7,.75); strike(t+3.4,.5);
    }catch(e){}
  }

  // ---------- wiring ----------
  startBtn.addEventListener('click', ()=>{ state.status==='running' ? pause() : begin(); });
  resetBtn.addEventListener('click', reset);
  chimeBtn.addEventListener('click', ()=>{
    state.chime=!state.chime; save(); render();
    if(state.chime){ unlockAudio(); }
  });
  doneEl.addEventListener('click', dismiss);
  document.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT') return;
    if(state.status==='done'){ dismiss(); return; }
    if(e.code==='Space'){ e.preventDefault(); state.status==='running' ? pause() : begin(); }
    else if(e.key==='r' || e.key==='R'){ reset(); }
  });
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && state.status==='running') tick(); });

  // ---------- boot ----------
  load();
  buildPresets();
  if(state.status==='running'){
    if(state.endAt - Date.now() <= 0){ state.status='done'; }
    else { startTick(); startPrompts(); }
  }else if(state.status==='paused'){
    setPrompt('Paused. Take your time.', true);
  }
  render();
})();
</script>
</body>
</html>
